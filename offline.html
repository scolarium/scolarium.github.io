<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет соединения — Școlarium</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#16213d;--muted:#5a6784;--line:#dbe4f2;--a:#233f8f;--b:#4c7dff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1627;--card:#16213a;--ink:#e8eefb;--muted:#9fb0cf;--line:#26365a;--a:#8fb0ff;--b:#6b93ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.c{width:min(420px,100%);padding:36px 28px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 32px -8px rgba(35,63,143,.22)}
img{width:72px;height:72px;border-radius:20px;margin-bottom:18px}
h1{margin:0 0 8px;font:700 1.5rem Georgia,"Times New Roman",serif}
p{margin:0 0 22px;color:var(--muted)}
button{padding:12px 28px;border:0;border-radius:999px;cursor:pointer;font:600 1rem inherit;color:#fff;background:linear-gradient(135deg,var(--b),var(--a))}
@media (prefers-color-scheme:dark){button{color:#0e1627}}
</style>
</head>
<body>
<main class="c">
  <img src="/icon-192.png" alt="" width="72" height="72">
  <h1>Нет соединения</h1>
  <p>Журналу нужен интернет, чтобы показать свежие оценки и сообщения. Проверьте Wi-Fi или мобильную сеть и попробуйте снова.</p>
  <button type="button" onclick="location.reload()">Повторить</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
